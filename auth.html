<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social - Auth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Social</h1>
        <div class="header-buttons">
            <a href="index.html">Home</a>
        </div>
    </header>
    <main class="auth-page">
        <div class="auth-box">
            <h2>Welcome</h2>
            <p class="auth-subtitle">Create an account or login</p>
            <div class="auth-section">
                <h3>Registration</h3>
                <input
                    type="text"
                    id="registerLogin"
                    placeholder="Login">

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password">
                <button id="registerBtn">
                    Register
                </button>
            </div>
            <div class="auth-line"></div>
            <div class="auth-section">
                <h3>Login</h3>
                <input
                    type="text"
                    id="loginLogin"
                    placeholder="Login">
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password">
                <button id="loginBtn">
                    Login
                </button>
            </div>
        </div>
    </main>

    <script type="module" src="./js/authPage.js"></script>
</body>
</html>
